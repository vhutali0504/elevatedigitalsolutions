<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1440" width="2400" height="1440">
  <title>Elevate Digital Solutions (EDS) brand board</title>
  <defs>
    <!-- unit hexagon, pointy-top, rounded corners via round line joins -->
    <polygon id="hex" points="0,-1 0.875,-0.5 0.875,0.5 0,1 -0.875,0.5 -0.875,-0.5" stroke-linejoin="round" stroke-width="0.08"/>

    <pattern id="gridDark" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1b2850" stroke-width="2" opacity="0.75"/>
    </pattern>
    <pattern id="gridLight" x="1440" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#dcdfe5" stroke-width="2"/>
    </pattern>

    <style>
      .brand { font-family: 'Outfit', 'Montserrat', 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- ===== Backgrounds ===== -->
  <rect x="0" y="0" width="1440" height="1440" fill="#0a1424"/>
  <rect x="0" y="0" width="1440" height="1440" fill="url(#gridDark)"/>

  <rect x="1440" y="0" width="960" height="720" fill="#f5f6f8"/>
  <rect x="1440" y="0" width="960" height="720" fill="url(#gridLight)"/>

  <rect x="1440" y="720" width="960" height="720" fill="#17233d"/>

  <!-- ===== Primary horizontal lockup (dark background) ===== -->
  <use href="#hex" transform="translate(452 720) scale(173)" fill="#f5f6f8" stroke="#f5f6f8"/>
  <path d="M412 680 L452 640 L492 680" fill="none" stroke="#2f5bff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="brand" x="452" y="792" text-anchor="middle" font-size="108" font-weight="700" fill="#0a1424" textLength="212" lengthAdjust="spacingAndGlyphs">EDS</text>

  <line x1="705" y1="600" x2="705" y2="840" stroke="#2a3552" stroke-width="2"/>

  <g class="brand" font-size="58" font-weight="500" fill="#f5f6f8">
    <text x="780" y="668" textLength="285" lengthAdjust="spacing">ELEVATE</text>
    <text x="780" y="739" textLength="266" lengthAdjust="spacing">DIGITAL</text>
    <text x="780" y="810" textLength="378" lengthAdjust="spacing">SOLUTIONS</text>
  </g>

  <!-- ===== Light background version ===== -->
  <use href="#hex" transform="translate(1920 326) scale(115)" fill="#111a2e" stroke="#111a2e"/>
  <path d="M1895 297 L1920 274 L1945 297" fill="none" stroke="#6f8cff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="brand" x="1920" y="374" text-anchor="middle" font-size="72" font-weight="700" fill="#f5f6f8" textLength="140" lengthAdjust="spacingAndGlyphs">EDS</text>

  <g class="brand" font-size="28" font-weight="500" fill="#4a5568">
    <text x="1650" y="505" textLength="316" lengthAdjust="spacing">ELEVATE DIGITAL</text>
    <text x="1650" y="541" textLength="206" lengthAdjust="spacing">SOLUTIONS</text>
  </g>

  <!-- ===== App icon scale set ===== -->
  <!-- 1: large -->
  <rect x="1561" y="945" width="254" height="254" rx="62" fill="#0a1424" stroke="#1f2d4d" stroke-width="2"/>
  <use href="#hex" transform="translate(1688 1072) scale(88)" fill="#f5f6f8" stroke="#f5f6f8"/>
  <path d="M1668 1051 L1688 1033 L1708 1051" fill="none" stroke="#2f5bff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="brand" x="1688" y="1108" text-anchor="middle" font-size="58" font-weight="700" fill="#0a1424" textLength="108" lengthAdjust="spacingAndGlyphs">EDS</text>

  <!-- 2: medium -->
  <rect x="1881" y="1057" width="142" height="142" rx="34" fill="#0a1424" stroke="#1f2d4d" stroke-width="2"/>
  <use href="#hex" transform="translate(1952 1128) scale(50)" fill="#f5f6f8" stroke="#f5f6f8"/>
  <path d="M1941 1118 L1952 1108 L1963 1118" fill="none" stroke="#2f5bff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="brand" x="1952" y="1149" text-anchor="middle" font-size="33" font-weight="700" fill="#0a1424" textLength="60" lengthAdjust="spacingAndGlyphs">EDS</text>

  <!-- 3: small (chevron only) -->
  <rect x="2089" y="1121" width="78" height="78" rx="20" fill="#0a1424" stroke="#1f2d4d" stroke-width="2"/>
  <use href="#hex" transform="translate(2128 1160) scale(27)" fill="#f5f6f8" stroke="#f5f6f8"/>
  <path d="M2116 1167 L2128 1155 L2140 1167" fill="none" stroke="#2f5bff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4: favicon -->
  <rect x="2233" y="1153" width="46" height="46" rx="12" fill="#0a1424" stroke="#1f2d4d" stroke-width="2"/>
  <use href="#hex" transform="translate(2256 1176) scale(16)" fill="#f5f6f8" stroke="#f5f6f8"/>
  <path d="M2249 1179 L2256 1172 L2263 1179" fill="none" stroke="#2f5bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
